<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Illustration of a smart glove with flex sensors sending gestures over Bluetooth to a phone that speaks the phrase">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#1b2a3a"/>
      <stop offset="1" stop-color="#07090d"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d4a63"/>
      <stop offset="1" stop-color="#16293a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5fd0ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>
  <rect width="800" height="800" fill="url(#grid)"/>

  <!-- Glove: palm + four fingers + thumb -->
  <g transform="translate(40 60)" stroke="#5fd0ff" stroke-width="3" stroke-linejoin="round" fill="url(#skin)" filter="url(#glow)">
    <!-- fingers -->
    <rect x="150" y="150" width="62" height="250" rx="31"/>
    <rect x="222" y="100" width="62" height="300" rx="31"/>
    <rect x="294" y="120" width="62" height="280" rx="31"/>
    <rect x="366" y="175" width="58" height="225" rx="29"/>
    <!-- palm -->
    <path d="M140 380 H434 V560 Q434 640 354 660 H220 Q140 640 140 560 Z"/>
    <!-- thumb -->
    <path d="M140 450 Q80 430 70 370 Q66 335 98 332 Q126 332 146 372 Z"/>
    <!-- cuff -->
    <rect x="170" y="655" width="234" height="58" rx="14" fill="#102030"/>
  </g>

  <!-- Flex sensor strips on each finger -->
  <g transform="translate(40 60)" fill="none" stroke="#ffb454" stroke-width="5" stroke-linecap="round" filter="url(#glow)">
    <path d="M181 180 V365"/>
    <path d="M253 130 V365"/>
    <path d="M325 150 V365"/>
    <path d="M395 200 V365"/>
  </g>
  <g transform="translate(40 60)" fill="#ffb454">
    <circle cx="181" cy="180" r="6"/>
    <circle cx="253" cy="130" r="6"/>
    <circle cx="325" cy="150" r="6"/>
    <circle cx="395" cy="200" r="6"/>
  </g>

  <!-- ESP32 board + IMU on the back of the hand -->
  <g transform="translate(40 60)">
    <rect x="200" y="470" width="170" height="92" rx="8" fill="#0d1620" stroke="#7dffb2" stroke-width="2.5"/>
    <rect x="214" y="484" width="64" height="64" rx="4" fill="#12202e" stroke="#7dffb2" stroke-opacity="0.6"/>
    <g fill="#7dffb2">
      <rect x="292" y="486" width="10" height="4"/><rect x="292" y="498" width="10" height="4"/>
      <rect x="292" y="510" width="10" height="4"/><rect x="292" y="522" width="10" height="4"/>
      <rect x="318" y="486" width="36" height="4"/><rect x="318" y="498" width="36" height="4"/>
    </g>
    <text x="285" y="552" font-family="monospace" font-size="13" fill="#7dffb2" fill-opacity="0.85">ESP32</text>
    <rect x="316" y="518" width="38" height="24" rx="3" fill="#0d1620" stroke="#5fd0ff" stroke-width="2"/>
    <text x="320" y="535" font-family="monospace" font-size="11" fill="#5fd0ff">IMU</text>
  </g>

  <!-- Bluetooth waves from the glove to the phone -->
  <g fill="none" stroke="#5fd0ff" stroke-linecap="round" stroke-width="4" filter="url(#glow)">
    <path d="M520 340 Q560 400 520 460" stroke-opacity="0.95"/>
    <path d="M548 312 Q612 400 548 488" stroke-opacity="0.65"/>
    <path d="M576 284 Q664 400 576 516" stroke-opacity="0.35"/>
  </g>

  <!-- Phone -->
  <g transform="translate(590 250)">
    <rect x="0" y="0" width="160" height="300" rx="26" fill="#0b1118" stroke="#5fd0ff" stroke-width="3" filter="url(#glow)"/>
    <rect x="14" y="40" width="132" height="220" rx="12" fill="#10202f"/>
    <rect x="58" y="14" width="44" height="8" rx="4" fill="#1d3347"/>
    <!-- Speech bubble -->
    <rect x="26" y="70" width="108" height="58" rx="14" fill="#5fd0ff" fill-opacity="0.16" stroke="#5fd0ff" stroke-width="2"/>
    <text x="80" y="106" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#ffffff">Namaste</text>
    <!-- Language chips -->
    <g font-family="monospace" font-size="13" text-anchor="middle">
      <rect x="22" y="150" width="50" height="28" rx="8" fill="#ffb454"/>
      <text x="47" y="169" fill="#101010" font-weight="bold">EN</text>
      <rect x="82" y="150" width="50" height="28" rx="8" fill="none" stroke="#5fd0ff" stroke-width="2"/>
      <text x="107" y="169" fill="#5fd0ff">HI</text>
      <rect x="22" y="188" width="50" height="28" rx="8" fill="none" stroke="#5fd0ff" stroke-width="2"/>
      <text x="47" y="207" fill="#5fd0ff">TA</text>
      <rect x="82" y="188" width="50" height="28" rx="8" fill="none" stroke="#5fd0ff" stroke-width="2"/>
      <text x="107" y="207" fill="#5fd0ff">BN</text>
    </g>
    <!-- Speaker waves -->
    <g fill="none" stroke="#7dffb2" stroke-width="3" stroke-linecap="round">
      <path d="M52 238 Q60 230 68 238"/>
      <path d="M44 244 Q60 224 76 244" stroke-opacity="0.6"/>
      <path d="M36 250 Q60 218 84 250" stroke-opacity="0.3"/>
    </g>
  </g>

  <!-- Caption -->
  <text x="400" y="768" text-anchor="middle" font-family="monospace" font-size="22" letter-spacing="4" fill="#5fd0ff" fill-opacity="0.85">SIGN → SPEECH GLOVE</text>
</svg>
